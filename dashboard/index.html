<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>knowhere</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230067c0'/%3E%3Crect x='7' y='7' width='8' height='8' fill='white'/%3E%3Crect x='17' y='7' width='8' height='8' fill='white'/%3E%3Crect x='7' y='17' width='8' height='8' fill='white'/%3E%3Crect x='17' y='17' width='8' height='8' fill='white'/%3E%3C/svg%3E">
<style>
:root{
  --accent:#0067c0; --text:#1a1a1f; --muted:#5b6068; --solid:#f6f7fa;
  --surface:rgba(249,249,252,.90); --card:rgba(255,255,255,.70); --task:rgba(243,244,248,.82);
  --stroke:rgba(0,0,0,.12); --stroke2:rgba(0,0,0,.07); --hover:rgba(0,0,0,.06);
  --ok:#0f7b0f; --okbg:rgba(15,123,15,.14); --warn:#8a5200; --warnbg:rgba(190,120,0,.18);
  --bad:#c42b1c; --badbg:rgba(196,43,28,.14); --off:#5b6068; --offbg:rgba(91,96,104,.16);
  --dot-ok:#2ec04f; --dot-warn:#f2a900; --dot-bad:#ee4b50; --dot-off:#9096a0;
  --wp:radial-gradient(60% 70% at 15% 90%,#2f6bff 0%,transparent 62%),
       radial-gradient(55% 60% at 88% 8%,#9a6bff 0%,transparent 62%),
       radial-gradient(45% 45% at 60% 55%,#3fb2e8 0%,transparent 70%),
       linear-gradient(135deg,#5b8def,#8f7bea);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --accent:#60cdff; --onaccent:#06222f; --text:#f3f4f7; --muted:#a3a9b3; --solid:#1f2128;
    --surface:rgba(34,36,44,.86); --card:rgba(255,255,255,.055); --task:rgba(24,26,33,.82);
    --stroke:rgba(255,255,255,.13); --stroke2:rgba(255,255,255,.08); --hover:rgba(255,255,255,.08);
    --ok:#6ccb5f; --okbg:rgba(108,203,95,.16); --warn:#fce100; --warnbg:rgba(252,225,0,.14);
    --bad:#ff99a4; --badbg:rgba(255,99,115,.18); --off:#a3a9b3; --offbg:rgba(163,169,179,.16);
    --wp:radial-gradient(60% 70% at 15% 90%,#0a4fd6 0%,transparent 62%),
         radial-gradient(55% 60% at 88% 8%,#6a2fd1 0%,transparent 62%),
         radial-gradient(45% 45% at 60% 55%,#0e7490 0%,transparent 70%),
         linear-gradient(135deg,#070b18,#101634);
  }
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--wp);color:var(--text);font:13px/1.4 "Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
code,.mono{font-family:"Cascadia Mono",Consolas,ui-monospace,SFMono-Regular,Menlo,monospace}

/* ---------- desktop ---------- */
.desktop{position:fixed;left:0;right:0;top:0;bottom:48px;overflow:auto;padding:8px}
.icons{display:grid;grid-auto-flow:column;grid-template-rows:repeat(auto-fill,var(--row,112px));grid-auto-columns:var(--col,92px);height:100%;align-content:start;justify-content:start}
.icon{all:unset;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;gap:6px;width:calc(var(--col,92px) - 2px);height:calc(var(--row,112px) - 4px);padding:8px 4px;border-radius:6px;cursor:default;color:#fff;text-align:center;text-shadow:0 1px 3px rgba(0,0,0,.7)}
.icon:hover{background:rgba(255,255,255,.14)}
.icon.sel,.icon:focus-visible{background:rgba(255,255,255,.22);box-shadow:inset 0 0 0 1px rgba(255,255,255,.4)}
.lbl{font-size:12px;line-height:1.25;max-width:84px;max-height:2.5em;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow-wrap:anywhere}
.icon.off .tile,.sitem.off .tile{filter:grayscale(.75) brightness(.8)}
.tilewrap{position:relative;display:block;width:var(--isz,52px);height:var(--isz,52px);flex:none}
.tile{display:grid;place-items:center;width:100%;height:100%;border-radius:24%;color:#fff;font-weight:650;letter-spacing:.02em;text-shadow:none;
  background:linear-gradient(145deg,hsl(var(--h) 78% 60%),hsl(calc(var(--h) + 30) 72% 40%));
  box-shadow:0 4px 10px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.35)}
.tile.round{border-radius:50%}
.dot{position:absolute;right:-3px;bottom:-3px;width:14px;height:14px;border-radius:50%;border:2px solid rgba(18,20,28,.8);background:var(--dot-off)}
.dot.ok{background:var(--dot-ok)}.dot.warn{background:var(--dot-warn)}.dot.bad{background:var(--dot-bad)}
.nomatch{color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.6);padding:20px;grid-row:1}

/* ---------- widget ---------- */
.wcol{position:absolute;top:12px;right:14px;width:300px;max-height:calc(100% - 24px);overflow:auto;display:flex;flex-direction:column;gap:10px}
.widget{flex:none;padding:14px 16px;border-radius:12px;color:var(--text);
  background:var(--surface);-webkit-backdrop-filter:blur(28px) saturate(1.5);backdrop-filter:blur(28px) saturate(1.5);border:1px solid var(--stroke);box-shadow:0 10px 30px rgba(0,0,0,.25)}
.whead{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px}
.whead b{font-size:15px;font-weight:600}
.wstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--stroke2);border-radius:8px;padding:6px 8px}
.stat b{display:block;font-size:20px;line-height:1.1;font-weight:600}
.stat span{font-size:11px;color:var(--muted)}
.stat.bad b{color:var(--bad)}
.wsec{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:12px 0 6px}
details.ifd>summary{list-style:none;cursor:default}
details.ifd>summary::-webkit-details-marker{display:none}
details.ifd>summary::after{content:" \25BE";letter-spacing:0}
details.ifd:not([open])>summary::after{content:" \25B8"}
.if{padding:6px 0;border-top:1px solid var(--stroke2)}
.if:first-of-type{border-top:0}
.ifh{display:flex;align-items:center;gap:8px}
.grp{font-size:10px;font-weight:700;letter-spacing:.04em;border-radius:4px;padding:1px 6px;background:var(--hover);color:var(--muted)}
.grp.lan{color:var(--ok);background:var(--okbg)}.grp.tailnet{color:#8a5cf6;background:rgba(138,92,246,.16)}
.ia{margin:3px 0 0;font-size:12px;overflow-wrap:anywhere}
.ia code{display:block}
.ia .v6{color:var(--muted);font-size:11px}
.filters{display:flex;flex-wrap:wrap;gap:5px}
.filters button{all:unset;cursor:default;padding:4px 10px;border-radius:999px;border:1px solid var(--stroke);background:var(--card);font-size:12px;color:var(--muted)}
.filters button:hover{background:var(--hover)}
.filters button.on{background:var(--accent);border-color:transparent;color:#fff}
@media (prefers-color-scheme: dark){.filters button.on{color:#06222f}}
.wfoot{margin-top:12px;font-size:11px;color:var(--muted);overflow-wrap:anywhere}
.alert{margin-top:10px;padding:8px 10px;border-radius:8px;background:var(--badbg);color:var(--bad);font-size:12px}

/* ---------- windows ---------- */
#windows{position:fixed;left:0;right:0;top:0;bottom:48px;z-index:10;pointer-events:none}
.win{position:absolute;pointer-events:auto;min-width:340px;min-height:240px;display:flex;flex-direction:column;resize:both;overflow:hidden;border-radius:9px;color:var(--text);
  background:var(--surface);-webkit-backdrop-filter:blur(30px) saturate(1.4);backdrop-filter:blur(30px) saturate(1.4);
  border:1px solid var(--stroke);box-shadow:0 8px 24px rgba(0,0,0,.25),0 2px 6px rgba(0,0,0,.2)}
.win.focus{box-shadow:0 22px 60px rgba(0,0,0,.45),0 2px 8px rgba(0,0,0,.25)}
.win.max{background:var(--solid);-webkit-backdrop-filter:none;backdrop-filter:none;left:0 !important;top:0 !important;right:0 !important;bottom:0 !important;width:auto !important;height:auto !important;border-radius:0;resize:none}
.win.min{display:none}
.tb{display:flex;align-items:center;height:36px;padding-left:10px;gap:8px;flex:none;user-select:none;-webkit-user-select:none;touch-action:none;color:var(--muted)}
.win.focus .tb{color:var(--text)}
.tbico{display:block;width:16px;height:16px;flex:none}
.tbico .tile{border-radius:4px;box-shadow:none}
.ttl{flex:1;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wb{all:unset;width:46px;height:36px;display:grid;place-items:center;cursor:default}
.wb:hover{background:var(--hover)}
.wb.x:hover{background:#c42b1c;color:#fff}
.g{position:relative;display:block;width:10px;height:10px}
.g-min::before{content:"";position:absolute;left:0;right:0;top:5px;height:1px;background:currentColor}
.g-max{border:1px solid currentColor;border-radius:1px}
.g-res{width:8px;height:8px;margin:2px 0 0 0;border:1px solid currentColor}
.g-res::before{content:"";position:absolute;left:1px;top:-3px;width:8px;height:8px;border-top:1px solid currentColor;border-right:1px solid currentColor}
.g-x::before,.g-x::after{content:"";position:absolute;left:4px;top:-1px;width:1px;height:12px;background:currentColor;transform:rotate(45deg)}
.g-x::after{transform:rotate(-45deg)}
.wbody{flex:1;overflow:auto;padding:4px 20px 20px}
.gone{padding:30px 0;text-align:center;color:var(--muted)}
.wh{display:flex;gap:14px;align-items:center;padding:4px 0 14px}
.wh .tilewrap{width:56px;height:56px}
.wh .tile{font-size:20px}
.wh h2{margin:0;font-size:20px;line-height:1.2;font-weight:600;overflow-wrap:anywhere}
.wh .sub{color:var(--muted);font-size:12px;overflow-wrap:anywhere;margin-top:2px}
.pill{display:inline-block;font-size:12px;font-weight:600;border-radius:999px;padding:1px 10px;margin-left:8px;vertical-align:3px}
.pill.ok{color:var(--ok);background:var(--okbg)}.pill.warn{color:var(--warn);background:var(--warnbg)}
.pill.bad{color:var(--bad);background:var(--badbg)}.pill.off{color:var(--off);background:var(--offbg)}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 6px}
.btn{display:inline-flex;align-items:center;padding:6px 16px;border-radius:5px;border:1px solid var(--stroke);background:var(--card);color:var(--text);text-decoration:none}
.btn:hover{background:var(--hover)}
.btn.pri{background:var(--accent);border-color:transparent;color:#fff}
@media (prefers-color-scheme: dark){.btn.pri{color:#06222f}}
.sec{font-size:13px;font-weight:600;margin:16px 0 8px}
.sec span{color:var(--muted);font-weight:400}
.pcard{background:var(--card);border:1px solid var(--stroke2);border-radius:8px;padding:10px 12px;margin-bottom:8px}
.ph{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:7px}
.pn{font-size:14px;font-weight:600}
.tag{font-size:10px;font-weight:700;border-radius:4px;padding:1px 6px;background:var(--accent);color:#fff}
@media (prefers-color-scheme: dark){.tag{color:#06222f}}
.bind{color:var(--muted);font-size:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;gap:6px;align-items:center;min-width:0;max-width:100%;padding:2px 9px;border-radius:6px;background:var(--hover);border:1px solid transparent;color:var(--text);text-decoration:none;font-size:12px;font-family:"Cascadia Mono",Consolas,ui-monospace,SFMono-Regular,Menlo,monospace}
.chip span{min-width:0;overflow-wrap:anywhere}
.chip b{font-family:"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;font-weight:600;color:var(--muted)}
a.chip{color:var(--accent);border-color:var(--stroke)}
a.chip:hover{background:var(--hover)}
.chip.g-lan b{color:var(--ok)}.chip.g-tailnet b{color:#8a5cf6}
button.chip{all:unset;cursor:default;display:inline-flex;gap:6px;align-items:center;padding:2px 9px;border-radius:6px;background:var(--hover);font-size:12px;color:var(--muted)}
.note{margin-top:7px;font-size:11px;color:var(--warn)}
.kv{display:grid;grid-template-columns:110px 1fr;gap:5px 12px;font-size:12px;margin:0}
.kv dt{color:var(--muted)}.kv dd{margin:0;overflow-wrap:anywhere}

/* ---------- taskbar ---------- */
.taskbar{position:fixed;left:0;right:0;bottom:0;height:48px;z-index:1000;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 8px;
  background:var(--task);-webkit-backdrop-filter:blur(30px) saturate(1.6);backdrop-filter:blur(30px) saturate(1.6);border-top:1px solid var(--stroke);color:var(--text)}
.tcenter{display:flex;align-items:center;gap:4px}
.tbtn{all:unset;box-sizing:border-box;height:40px;min-width:40px;display:flex;align-items:center;justify-content:center;gap:8px;border-radius:6px;cursor:default;position:relative}
.tbtn:hover{background:var(--hover)}
.tbtn.act{background:var(--hover)}
.logo{display:grid;grid-template-columns:9px 9px;grid-template-rows:9px 9px;gap:2px}
.logo i{display:block;background:var(--accent)}
.search{padding:0 14px;min-width:200px;height:34px;justify-content:flex-start;border-radius:17px;background:var(--card);border:1px solid var(--stroke2);color:var(--muted)}
.mag{width:11px;height:11px;border:2px solid currentColor;border-radius:50%;position:relative;flex:none}
.mag::after{content:"";position:absolute;width:2px;height:6px;background:currentColor;right:-4px;bottom:-6px;transform:rotate(-45deg)}
.app{padding:0 9px}
.app .tilewrap{width:24px;height:24px}
.app::after{content:"";position:absolute;bottom:2px;left:50%;width:6px;height:3px;margin-left:-3px;border-radius:2px;background:var(--muted)}
.app.act::after{width:16px;margin-left:-8px;background:var(--accent)}
.app.mn::after{width:6px;margin-left:-3px;background:var(--muted)}
.tray{justify-self:end;display:flex;align-items:center;gap:10px;padding-right:6px}
.live{width:9px;height:9px;border-radius:50%;background:var(--dot-off)}
.live.on{background:var(--dot-ok);box-shadow:0 0 0 3px var(--okbg)}.live.off{background:var(--dot-bad)}
.clk{text-align:right;font-size:12px;line-height:1.25}

/* ---------- start menu ---------- */
.start{position:fixed;left:50%;bottom:56px;transform:translateX(-50%);z-index:1001;width:min(640px,calc(100vw - 16px));height:min(640px,calc(100vh - 72px));display:flex;flex-direction:column;padding:20px;border-radius:12px;color:var(--text);
  background:var(--surface);-webkit-backdrop-filter:blur(40px) saturate(1.6);backdrop-filter:blur(40px) saturate(1.6);border:1px solid var(--stroke);box-shadow:0 20px 60px rgba(0,0,0,.4)}
.start[hidden]{display:none}
.sq{width:100%;height:38px;padding:0 16px;border-radius:19px;border:1px solid var(--stroke);background:var(--card);color:var(--text);font:inherit;outline:none}
.sq:focus{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.sh{display:flex;justify-content:space-between;margin:16px 4px 8px;font-size:13px;font-weight:600}
.sh span{color:var(--muted);font-weight:400}
.sgrid{flex:1;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));grid-auto-rows:108px;gap:4px;align-content:start}
.sitem{all:unset;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 4px;border-radius:6px;cursor:default;text-align:center}
.sitem:hover,.sitem:focus-visible{background:var(--hover)}
.sitem .lbl{color:var(--text);font-size:12px;max-width:86px}
.sitem .tilewrap{width:44px;height:44px}
.sitem .tile{font-size:16px}
.sfoot{margin-top:10px;padding-top:10px;border-top:1px solid var(--stroke2);font-size:12px;color:var(--muted)}

.tile svg{width:58%;height:58%;fill:none;stroke:#fff;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tbico .tile svg{width:74%;height:74%}
#toasts{position:fixed;right:14px;bottom:58px;z-index:1002;display:flex;flex-direction:column;gap:8px;width:min(320px,calc(100vw - 28px));pointer-events:none}
.toast{pointer-events:auto;display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:10px;color:var(--text);cursor:default;background:var(--surface);-webkit-backdrop-filter:blur(30px);backdrop-filter:blur(30px);border:1px solid var(--stroke);box-shadow:0 10px 30px rgba(0,0,0,.35);animation:tin .25s ease-out}
@keyframes tin{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}
.toast .dot,.ev .dot{position:static;flex:none;width:10px;height:10px;margin-top:5px}
.toast b{display:block;font-weight:600}.toast span{color:var(--muted);font-size:12px}
.ev{display:flex;gap:8px;padding:6px 0;border-top:1px solid var(--stroke2);font-size:12px;cursor:default}
.ev:first-child{border-top:0}
.ev:hover{background:var(--hover)}
.badge{display:none;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--dot-bad);color:#fff;font-size:11px;font-weight:700;align-items:center;justify-content:center}
.badge.on{display:inline-flex}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tile.logo{background:#f4f5f8}}
:root[data-theme="dark"]{
  --accent:#60cdff; --onaccent:#06222f; --text:#f3f4f7; --muted:#a3a9b3; --solid:#1f2128;
  --surface:rgba(34,36,44,.86); --card:rgba(255,255,255,.055); --task:rgba(24,26,33,.82);
  --stroke:rgba(255,255,255,.13); --stroke2:rgba(255,255,255,.08); --hover:rgba(255,255,255,.08);
  --ok:#6ccb5f; --okbg:rgba(108,203,95,.16); --warn:#fce100; --warnbg:rgba(252,225,0,.14);
  --bad:#ff99a4; --badbg:rgba(255,99,115,.18); --off:#a3a9b3; --offbg:rgba(163,169,179,.16);
  --wp:radial-gradient(60% 70% at 15% 90%,#0a4fd6 0%,transparent 62%),
       radial-gradient(55% 60% at 88% 8%,#6a2fd1 0%,transparent 62%),
       radial-gradient(45% 45% at 60% 55%,#0e7490 0%,transparent 70%),
       linear-gradient(135deg,#070b18,#101634);
}
.tile.logo{background:#f4f5f8;box-shadow:0 4px 10px rgba(0,0,0,.25),inset 0 0 0 1px rgba(0,0,0,.06)}
.tile.logo svg{display:none}
.tile img{width:64%;height:64%;object-fit:contain;pointer-events:none;-webkit-user-drag:none}
html.nolabels .icon .lbl{display:none}
.filters button.on,.btn.pri,.tag,.seg2 button.on{color:var(--onaccent,#fff)}
.sset{display:grid;grid-template-columns:140px 1fr;min-height:100%}
.snav{padding:6px 8px 6px 0;border-right:1px solid var(--stroke2)}
.snav button{all:unset;display:block;box-sizing:border-box;width:100%;padding:8px 12px;border-radius:6px;cursor:default}
.snav button:hover{background:var(--hover)}.snav button.on{background:var(--hover);font-weight:600}
.spage{padding:2px 2px 0 18px;min-width:0}
.spage h3{margin:4px 0 12px;font-size:18px;font-weight:600}
.srow{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:10px 12px;margin-bottom:6px;background:var(--card);border:1px solid var(--stroke2);border-radius:8px}
.srow small{display:block;color:var(--muted)}
.seg2{display:flex;gap:4px;flex-wrap:wrap}
.seg2 button{all:unset;cursor:default;padding:4px 12px;border-radius:6px;border:1px solid var(--stroke);background:var(--card);font-size:12px}
.seg2 button.on{background:var(--accent);border-color:transparent}
.sw{display:flex;gap:6px;flex-wrap:wrap}
.sw button{all:unset;cursor:default;width:34px;height:24px;border-radius:6px;border:2px solid transparent;box-shadow:0 0 0 1px var(--stroke)}
.sw button.on{border-color:var(--text)}
.chk{display:flex;align-items:center;gap:8px;padding:5px 12px;font-size:12px}
.icon{user-select:none;-webkit-user-select:none}
.tile{position:relative;container-type:size}
.tile img{position:absolute;left:18%;top:18%;width:64%;height:64%;object-fit:contain}
.tile .emo{font-size:56cqw;line-height:1}
.app:not(.run)::after{display:none}
#ctx{position:fixed;z-index:3000;min-width:220px;padding:6px;border-radius:10px;color:var(--text);background:var(--surface);-webkit-backdrop-filter:blur(30px) saturate(1.5);backdrop-filter:blur(30px) saturate(1.5);border:1px solid var(--stroke);box-shadow:0 12px 36px rgba(0,0,0,.4)}
#ctx[hidden],#dlg[hidden]{display:none}
#ctx button{all:unset;display:flex;box-sizing:border-box;width:100%;padding:6px 10px;border-radius:6px;cursor:default;gap:8px}
#ctx button:hover{background:var(--hover)}
#ctx button[disabled]{opacity:.45}
#ctx hr{border:0;border-top:1px solid var(--stroke2);margin:5px 4px}
#ctx .ck{width:14px;flex:none}
#dlg{position:fixed;inset:0;z-index:2500;background:rgba(0,0,0,.35);display:grid;place-items:center}
.dbox{width:min(540px,calc(100vw - 24px));max-height:calc(100vh - 40px);overflow:auto;border-radius:12px;padding:18px;color:var(--text);background:var(--solid);border:1px solid var(--stroke);box-shadow:0 20px 60px rgba(0,0,0,.5)}
.dbox h3{margin:0 0 12px;font-size:16px}
.dbtns{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.dbox input[type=text]{width:100%;padding:8px 10px;border-radius:6px;border:1px solid var(--stroke);background:var(--card);color:var(--text);font:inherit}

.igrid button{all:unset;cursor:default;display:grid;place-items:center;height:48px;border-radius:8px;border:2px solid transparent;background:var(--card)}
.igrid button.on{border-color:var(--accent)}
.igrid .tilewrap{width:34px;height:34px}
.bigclk{font-size:34px;font-weight:600;line-height:1.1;letter-spacing:-.01em}
.mrow{display:flex;justify-content:space-between;gap:8px;margin:8px 0 4px;font-size:12px}
.mrow span{color:var(--muted)}
.meter{height:6px;border-radius:3px;background:var(--hover);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent)}
.spark{width:100%;height:36px;margin-top:6px;color:var(--accent)}
.wstats4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.wstats4 .stat b{font-size:17px}
.wbr{display:flex;flex-direction:column;height:calc(100% + 24px);margin:-4px -20px -20px}
.btool{display:flex;gap:6px;padding:6px 8px;border-bottom:1px solid var(--stroke2);flex:none}
.btool .btn{padding:4px 10px;font-size:12px}
.btool .addr{flex:1;min-width:0;padding:4px 10px;border-radius:6px;border:1px solid var(--stroke);background:var(--card);color:var(--text);font:12px "Cascadia Mono",Consolas,ui-monospace,monospace}
.bhold{flex:1;min-height:0;position:relative}
.bfr{position:absolute;left:0;top:0;width:100%;height:100%;border:0;background:#fff}
.bnote{padding:30px 24px}
.bhint{padding:6px 12px;font-size:11px;color:var(--warn);flex:none}
.wbody.shell{display:flex;flex-direction:column;overflow:hidden;padding:0}
.wtabs{display:flex;gap:2px;padding:0 14px;border-bottom:1px solid var(--stroke2);flex:none}
.wtab{all:unset;cursor:default;padding:8px 14px;font-size:12px;color:var(--muted);border-bottom:2px solid transparent}
.wtab:hover{color:var(--text)}
.wtab.on{color:var(--text);border-bottom-color:var(--accent);font-weight:600}
.wpane{flex:1;min-height:0;overflow:auto;padding:12px 20px 20px}
.wpane[hidden]{display:none}
.wapp{padding:0;overflow:hidden;position:relative}
.wapp .wbr{height:100%;margin:0}
.fx{display:grid;grid-template-columns:190px 1fr;grid-template-rows:auto 1fr auto;height:calc(100% + 24px);margin:-4px -20px -20px;min-height:0;outline:none}
.fxbar{grid-column:1/3;display:flex;gap:6px;padding:6px 8px;border-bottom:1px solid var(--stroke2);align-items:center}
.fxbar .btn{padding:3px 10px;font-size:12px}
.fxbar .btn[disabled]{opacity:.4}
.fxbar input{padding:4px 10px;border-radius:6px;border:1px solid var(--stroke);background:var(--card);color:var(--text);font:12px "Cascadia Mono",Consolas,ui-monospace,monospace;min-width:0}
.fxbar .addr{flex:1}
.fxbar .flt{width:130px;font-family:inherit}
.fxside{border-right:1px solid var(--stroke2);padding:8px;overflow:auto;min-height:0}
.fxside h4{margin:4px 6px 6px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.fxside button{all:unset;display:block;width:100%;box-sizing:border-box;padding:6px 8px;border-radius:6px;cursor:default;font-size:12px}
.fxside button:hover,.fxside button.on{background:var(--hover)}
.fxside .mini{height:4px;border-radius:2px;background:var(--hover);margin-top:5px;overflow:hidden}
.fxside .mini i{display:block;height:100%;background:var(--accent)}
.fxside small{color:var(--muted);font-size:10px}
.fxmain{display:flex;flex-direction:column;min-width:0;min-height:0}
.fxlist{flex:1;min-height:0;overflow:auto}
.fxtbl{width:100%;border-collapse:collapse;font-size:12px}
.fxtbl th{position:sticky;top:0;background:var(--solid);text-align:left;font-weight:600;color:var(--muted);padding:6px 10px;cursor:default;border-bottom:1px solid var(--stroke2);white-space:nowrap}
.fxtbl td{padding:4px 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:280px}
.fxtbl tr.row:hover{background:var(--hover)}
.fxtbl tr.sel{background:var(--hover);box-shadow:inset 2px 0 var(--accent)}
.fxico{display:inline-block;width:18px;height:18px;vertical-align:-4px;margin-right:8px}
.fxico svg{width:100%;height:100%;fill:none;stroke:var(--accent);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.fxprev{flex:none;height:38%;border-top:1px solid var(--stroke2);padding:10px 14px;overflow:auto;font-size:12px}
.fxprev pre{margin:0;font:12px/1.5 "Cascadia Mono",Consolas,ui-monospace,monospace;white-space:pre-wrap;word-break:break-word}
.fxprev img{max-width:100%;max-height:100%;object-fit:contain;background:var(--card)}
.fxstat{grid-column:1/3;padding:4px 10px;border-top:1px solid var(--stroke2);font-size:11px;color:var(--muted)}
/* ---------- small screens ---------- */
@media (max-width:760px){
  .desktop{display:flex;flex-direction:column;padding:8px}
  .wcol{position:static;width:auto;max-height:none;order:-1;margin:0 0 8px;flex:none}
  .icons{display:grid;grid-auto-flow:row;grid-template-rows:none;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));grid-auto-columns:auto;height:auto;justify-content:stretch}
  .icon{width:auto}
  .icons{flex:none}
  .search{min-width:40px;width:40px;padding:0;justify-content:center}.search span{display:none}
  .clk .d{display:none}
  .win{min-width:0}
}

<script>
(function(){
'use strict';
var snap=null, query='', filter='all', selected=null;
var wins=[], zTop=20, cascade=0, focusId=null;
var coarse=!!(window.matchMedia && window.matchMedia('(pointer: coarse)').matches);
var RANK={lan:0,tailnet:1,loopback:2,other:3,docker:4};
var GNAME={lan:'LAN',tailnet:'Tailscale',loopback:'Loopback',other:'Other',docker:'Docker'};
var FILTERS=[['all','All'],['docker','Docker'],['host','Host'],['running','Running'],['problems','Problems']];

function $(id){return document.getElementById(id);}
function small(){return window.innerWidth<760;}
function add(e,c){
  if(c==null||c===false) return;
  if(Array.isArray(c)){ c.forEach(function(x){add(e,x);}); return; }
  e.appendChild(c.nodeType? c : document.createTextNode(String(c)));
}
function h(tag,attrs){
  var e=document.createElement(tag);
  if(attrs) Object.keys(attrs).forEach(function(k){
    var v=attrs[k];
    if(k==='class') e.className=v;
    else if(k==='href'){ if(/^https?:\/\//.test(v)){ e.href=v; e.target='_blank'; e.rel='noopener'; } }
    else e.setAttribute(k,v);
  });
  for(var i=2;i<arguments.length;i++) add(e,arguments[i]);
  return e;
}

function soft(name){
  var out=[];
  name.split(/([-_.])/).forEach(function(p){
    if(p==='') return;
    out.push(document.createTextNode(p));
    if(/^[-_.]$/.test(p)) out.push(document.createElement('wbr'));
  });
  return out;
}
/* ---------- model helpers ---------- */
function hue(s){var x=0;for(var i=0;i<s.length;i++) x=(x*31+s.charCodeAt(i))>>>0;return x%360;}
function initials(n){
  var p=n.replace(/[^A-Za-z0-9]+/g,' ').trim().split(' ').filter(Boolean);
  return (p.length>1? p[0][0]+p[1][0] : (p[0]||'?').slice(0,2)).toUpperCase();
}
var GL={
 film:'<rect x="3" y="4" width="18" height="16" rx="3"/><path d="M10 9l5 3-5 3z"/>',
 music:'<path d="M9 18V6l10-2v12"/><circle cx="7" cy="18" r="2"/><circle cx="17" cy="16" r="2"/>',
 photo:'<rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="1.6"/><path d="M4 18l5-5 4 4 3-3 4 4"/>',
 shield:'<path d="M12 3l8 3v6c0 4.5-3.2 7.6-8 9-4.8-1.4-8-4.5-8-9V6z"/><path d="M9 12l2 2 4-4"/>',
 box:'<path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M12 12l8-4.5M12 12L4 7.5M12 12v9"/>',
 db:'<ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v6c0 1.7 3.1 3 7 3s7-1.3 7-3V6M5 12v6c0 1.7 3.1 3 7 3s7-1.3 7-3v-6"/>',
 bolt:'<path d="M13 3L5 13h6l-1 8 8-10h-6z"/>',
 chart:'<path d="M4 19V5M4 19h16"/><path d="M8 15l3-4 3 2 4-6"/>',
 term:'<rect x="3" y="4" width="18" height="16" rx="3"/><path d="M7 9l3 3-3 3M12 15h5"/>',
 mesh:'<circle cx="12" cy="5" r="2"/><circle cx="5" cy="18" r="2"/><circle cx="19" cy="18" r="2"/><path d="M12 7v4M12 11l-6 5M12 11l6 5"/>',
 clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
 globe:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/>',
 net:'<rect x="3" y="14" width="18" height="6" rx="2"/><path d="M7 14v-4M12 14V6M17 14v-4"/>',
 gear:'<circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/>',
 grid:'<rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/>',
 lock:'<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/>',
 cloud:'<path d="M7 18a4 4 0 010-8 5 5 0 019.6-1A4.5 4.5 0 0117 18z"/>',
 rec:'<rect x="3" y="5" width="18" height="14" rx="3"/><circle cx="12" cy="12" r="3"/>'
};
var RULES=[
 [/postgres|mysql|mariadb|mongo|influx|clickhouse|sqlite|database|[-_]pg\b|pgvector/,'db',255],
 [/redis|valkey|memcache|keydb/,'bolt',20],
 [/socket-proxy|docker-proxy|vault|crowdsec|fail2ban/,'lock',45],
 [/jellyfin|plex|emby|kodi|sonarr|radarr|tautulli/,'film',8],
 [/navidrome|airsonic|subsonic|mpd|music|lidarr/,'music',330],
 [/immich|photoprism|piwigo|lychee|photo/,'photo',165],
 [/pihole|adguard/,'shield',350],
 [/portainer|dockge|watchtower|containerd|dockerd|podman/,'box',205],
 [/grafana|prometheus|ntop|netdata|zabbix|loki|uptime|glances/,'chart',140],
 [/sshd|ssh/,'term',150],
 [/tailscale|wireguard|zerotier|headscale|openvpn|vpn/,'mesh',270],
 [/chrony|ntp|timesync/,'clock',190],
 [/networkd|networkmanager|dhcp|netplan/,'net',215],
 [/resolved|unbound|dnsmasq|coredns|bind|dns/,'globe',200],
 [/nginx|caddy|traefik|haproxy|apache|httpd|proxy/,'globe',225],
 [/nextcloud|owncloud|seafile|syncthing|cloud/,'cloud',210],
 [/dashboard/,'grid',215],
 [/blackbox|recorder|camera|frigate/,'rec',300]
];
var LOGOS=[
 [/valkey/,'valkey'],[/redis/,'redis'],[/mariadb/,'mariadb'],[/mysql/,'mysql'],[/mongo/,'mongodb'],
 [/postgres|pgvector|[-_]pg\b/,'postgresql'],
 [/jellyfin/,'jellyfin'],[/navidrome/,'navidrome'],[/immich/,'immich'],[/pi-?hole/,'pi-hole'],
 [/portainer/,'portainer'],[/tailscale/,'tailscale'],[/adguard/,'adguard-home'],[/grafana/,'grafana'],
 [/prometheus/,'prometheus'],[/nextcloud/,'nextcloud'],[/\bplex/,'plex'],[/sonarr/,'sonarr'],[/radarr/,'radarr'],
 [/home-?assistant/,'home-assistant'],[/syncthing/,'syncthing'],[/vaultwarden/,'vaultwarden'],
 [/uptime-kuma/,'uptime-kuma'],[/gitea/,'gitea'],[/wireguard/,'wireguard'],[/nginx/,'nginx'],
 [/caddy/,'caddy'],[/traefik/,'traefik']
];
function logoFor(s){
  var key=((s.oname||s.name)+' '+(s.image||'')+' '+(s.compose||'')).toLowerCase();
  for(var i=0;i<LOGOS.length;i++) if(LOGOS[i][0].test(key)) return LOGOS[i][1];
  return null;
}
function glyphFor(s){
  if(s.glyph) return {d:GL[s.glyph],hue:s.hue};
  var key=((s.oname||s.name)+' '+(s.image||'')+' '+(s.compose||'')).toLowerCase();
  for(var i=0;i<RULES.length;i++) if(RULES[i][0].test(key)) return {d:GL[RULES[i][1]],hue:RULES[i][2]};
  return {d:GL[s.source==='docker'?'box':'gear'],hue:null};
}
function svgIcon(d){
  var v=document.createElementNS('http://www.w3.org/2000/svg','svg');
  v.setAttribute('viewBox','0 0 24 24'); v.setAttribute('aria-hidden','true'); v.innerHTML=d;
  return v;
}
function tile(s,bare){
  if(s.svcRef){ var sb=byId(s.svcRef); if(sb) return tile(sb,bare); }
  var g=glyphFor(s), ov0=s.app? null : ((settings.over[s.id]||{}).icon||null);
  if(ov0&&ov0.k==='glyph'&&GL[ov0.v]) g={d:GL[ov0.v],hue:g.hue};
  var t=h('span',{'class':'tile'+(s.source==='host'?' round':'')},svgIcon(g.d));
  t.style.setProperty('--h',String(g.hue==null? hue(s.name) : g.hue));
  var lg=s.app? null : (ov0? (ov0.k==='logo'? ov0.v : null) : logoFor(s));
  if(ov0&&ov0.k==='emoji'){ t.classList.add('custom'); t.textContent=''; t.appendChild(h('span',{'class':'emo'},ov0.v)); }
  if(ov0&&ov0.k==='data'){ t.classList.add('logo'); t.textContent=''; t.appendChild(h('img',{src:ov0.v,alt:'',draggable:'false'})); }
  if(lg){
    var im=h('img',{src:'/icons/'+lg+'.svg',alt:'',draggable:'false'});
    im.addEventListener('error',function(){ t.classList.remove('logo'); if(im.parentNode) im.parentNode.removeChild(im); });
    t.classList.add('logo'); t.appendChild(im);
  }
  return t;
}
function status(s){
  if(s.state==='running'){
    if(s.health==='unhealthy') return ['unhealthy','bad'];
    if(s.health==='healthy') return ['healthy','ok'];
    if(s.health==='starting') return ['starting','warn'];
    return ['running','ok'];
  }
  if(s.state==='restarting'||s.state==='paused'||s.state==='created') return [s.state,'warn'];
  return [s.state,'off'];
}
function isProblem(s){return s.health==='unhealthy'||s.state==='exited'||s.state==='dead'||s.state==='restarting';}
function byId(id){ if(APPS[id]) return APPS[id]; if(WEBS[id]) return WEBS[id]; return snap? snap.services.filter(function(s){return s.id===id;})[0] : null;}

function portGroups(s){
  var m={}, order=[];
  s.ports.forEach(function(p){
    var k=p.proto+'/'+p.port;
    if(!m[k]){ m[k]={proto:p.proto,port:p.port,binds:[],reach:[],seen:{},scheme:''}; order.push(k); }
    var g=m[k];
    if(g.binds.indexOf(p.bind)<0) g.binds.push(p.bind);
    if(p.scheme) g.scheme=p.scheme;
    if(p.aliases&&!g.aliases) g.aliases=p.aliases;
    if(p.embed) g.embed=p.embed;
    p.reach.forEach(function(r){ var rk=r.iface+'|'+r.ip; if(!g.seen[rk]){ g.seen[rk]=1; g.reach.push(r); } });
  });
  return order.map(function(k){
    var g=m[k];
    g.reach.sort(function(a,b){return (RANK[a.group]-RANK[b.group])||a.iface.localeCompare(b.iface)||a.ip.localeCompare(b.ip);});
    return g;
  });
}
function filterOK(s,f){
  return f==='all'||(f==='docker'&&s.source==='docker')||(f==='host'&&s.source==='host')||(f==='running'&&s.state==='running')||(f==='problems'&&isProblem(s));
}
function textMatch(s){
  if(!query) return true;
  var hay=[s.name,s.image,s.compose,s.state,s.health,s.source].concat(s.internal_ports||[]);
  s.ports.forEach(function(p){
    hay.push(String(p.port),p.proto,p.bind,p.scheme);
    p.reach.forEach(function(r){hay.push(r.iface,r.ip);});
  });
  return hay.join(' ').toLowerCase().indexOf(query)>=0;
}
function matches(s){return filterOK(s,filter);}
function visible(){
  if(!snap) return [];
  var l=snap.services.filter(function(s){return matches(s)&&settings.hidden.indexOf(s.id)<0;});
  var rk=function(s){return (s.health==='unhealthy'||s.state!=='running')?0:1;};
  if(settings.sort==='status') l.sort(function(a,b){return rk(a)-rk(b)||a.name.localeCompare(b.name);});
  else if(settings.sort==='source') l.sort(function(a,b){return a.source.localeCompare(b.source)||a.name.localeCompare(b.name);});
  else if(settings.sort==='custom'){ var ix=function(x){var i=settings.order.indexOf(x.id);return i<0?9999:i;}; l.sort(function(a,b){return ix(a)-ix(b)||a.name.localeCompare(b.name);}); }
  return l;
}
function startList(){
  var apps=Object.keys(APPS).map(function(k){return APPS[k];}).filter(function(a){return !query||a.name.toLowerCase().indexOf(query)>=0;});
  return apps.concat(snap? snap.services.filter(textMatch) : []);
}

/* ---------- desktop icons ---------- */
function icon(s){
  var st=status(s);
  var b=h('button',{'class':'icon'+(selected===s.id?' sel':'')+(st[1]==='off'?' off':''),'data-id':s.id,title:s.name+' - '+st[0]+(s.status_text?'\n'+s.status_text:'')+(s.image?'\n'+s.image:'')},
    h('span',{'class':'tilewrap'},tile(s),s.app?null:h('i',{'class':'dot '+st[1]})),
    h('span',{'class':'lbl'},soft(s.name)));
  b.addEventListener('click',function(e){
    e.stopPropagation(); if(suppressClick) return;
    if(coarse||small()) openWin(s.id); else { selected=s.id; markSel(); }
  });
  b.addEventListener('dblclick',function(){openService(s);});
  b.addEventListener('pointerdown',function(e){
    if(e.button!==0||s.app||e.pointerType==='touch') return;
    var sx=e.clientX, sy=e.clientY, dragging=false, ghost=null;
    function mv(ev){
      if(!dragging){
        if(Math.abs(ev.clientX-sx)+Math.abs(ev.clientY-sy)<8) return;
        dragging=true; ghost=b.cloneNode(true); ghost.classList.remove('sel');
        ghost.style.cssText='position:fixed;pointer-events:none;opacity:.85;z-index:4000;margin:0';
        document.body.appendChild(ghost); b.style.opacity='.4';
      }
      ghost.style.left=(ev.clientX-45)+'px'; ghost.style.top=(ev.clientY-40)+'px';
    }
    function up(ev){
      document.removeEventListener('pointermove',mv); document.removeEventListener('pointerup',up);
      if(!dragging) return;
      ghost.remove(); b.style.opacity='';
      suppressClick=true; setTimeout(function(){suppressClick=false;},0);
      var t=document.elementFromPoint(ev.clientX,ev.clientY), ti=t&&t.closest('.icon');

    var da=a.type==='dir'?0:1, db=b.type==='dir'?0:1; if(da!==db) return da-db;
    var v, k=FX.sk;
    if(k==='size') v=a.size-b.size; else if(k==='mtime') v=a.mtime-b.mtime; else if(k==='owner') v=(a.owner||'').localeCompare(b.owner||'');
    else v=a.name.localeCompare(b.name,undefined,{numeric:true,sensitivity:'base'});
    return FX.asc? v : -v;
  });
  var tb=h('tbody'), th=h('tr');
  [['name','Name'],['size','Size'],['mtime','Modified'],['owner','Owner'],['mode','Permissions']].forEach(function(c){
    var x=h('th',null,c[1]+(FX.sk===c[0]?(FX.asc?' \u25b4':' \u25be'):''));
    x.addEventListener('click',function(){ if(c[0]==='mode') return; if(FX.sk===c[0]) FX.asc=!FX.asc; else { FX.sk=c[0]; FX.asc=true; } fxRows(); });
    th.appendChild(x);
  });
  list.forEach(function(e){
    var ic=h('span',{'class':'fxico'},svgIcon(FG[fxType(e)]));
    var tr=h('tr',{'class':'row'+(FX.sel===e.name?' sel':'')},
      h('td',null,ic,e.name+(e.type==='link'?'  ->  '+e.target:'')),h('td',null,e.type==='dir'?'':fxSize(e.size)),h('td',null,fxDate(e.mtime)),h('td',null,e.owner||''),h('td',{style:'font-family:monospace'},e.mode));
    tr.addEventListener('click',function(){ if(FX.sel!==e.name) fxSelect(e); });
    tr.addEventListener('dblclick',function(){ fxOpen(e); });
    tr.addEventListener('contextmenu',function(ev){ ev.preventDefault(); ev.stopPropagation(); fxMenu(e,ev.clientX,ev.clientY); });
    tb.appendChild(tr);
  });
  var t=h('table',{'class':'fxtbl'},h('thead',null,th),tb);
  lst.insertBefore(t,lst.firstChild);
  if(FX.stat) FX.stat.textContent=list.length+' items'+(FX.filter?' (filtered)':'')+(FX.trunc?' - list truncated at 3000':'')+(FX.sel?'  |  selected: '+FX.sel:'');
}
function renderFiles(){
  if(!FX.root){
    FX.root=h('div',{'class':'fx',tabindex:'0'});
    FX.root.addEventListener('keydown',function(e){
      if(e.target.tagName==='INPUT') return;
      if(e.key==='Backspace'){ e.preventDefault(); if(FX.parent) fxGo(FX.parent); }
      else if(e.key==='F5'){ e.preventDefault(); e.stopPropagation(); if(FX.path) fxGo(FX.path,false); }
    });
    fxApi('/api/fs/roots').then(function(d){ FX.roots=d; if(!d.trusted||!d.roots.length){ fxRender(); return; } fxGo(d.roots[0].path); }).catch(function(e){ FX.err=e.message; fxRender(); });
  }
  fxRender();
  return FX.root;
}
APPS['app:files']={id:'app:files',name:'Files',source:'app',app:true,state:'running',ports:[],glyph:'folder',hue:42,render:renderFiles};
/* ---------- widgets ---------- */
var sysHist=[];
function fmtB(n){ return (n/1073741824).toFixed(1)+' GB'; }
function fmtUp(sec){ var d=Math.floor(sec/86400), hh=Math.floor(sec%86400/3600), m=Math.floor(sec%3600/60); return (d?d+'d ':'')+hh+'h '+m+'m'; }
function spark(vals,max){
  var ns='http://www.w3.org/2000/svg', v=document.createElementNS(ns,'svg');
  v.setAttribute('viewBox','0 0 120 30'); v.setAttribute('class','spark'); v.setAttribute('preserveAspectRatio','none');
  var pts=vals.map(function(x,i){ return (i*(120/59)).toFixed(1)+','+(30-Math.min(30,x/max*30)).toFixed(1); }).join(' ');
  var p=document.createElementNS(ns,'polyline'); p.setAttribute('points',pts); p.setAttribute('fill','none'); p.setAttribute('stroke','currentColor'); p.setAttribute('stroke-width','1.5');
  v.appendChild(p); return v;
}
function meter(pct){ var m=h('div',{'class':'meter'},h('i')); m.firstChild.style.width=Math.max(0,Math.min(100,pct))+'%'; return m; }
function renderSys(d){
  var b=$('sysbody'); b.textContent='';
  if(!d){ b.appendChild(h('div',{'class':'bind'},'Waiting for data...')); return; }
  var mp=d.mem_total? 100*d.mem_used/d.mem_total : 0;
  b.appendChild(h('div',{'class':'mrow'},h('b',null,'CPU'),h('span',null,d.cpu.toFixed(0)+'% of '+d.cores+' cores')));
  b.appendChild(meter(d.cpu)); b.appendChild(spark(sysHist,100));
  b.appendChild(h('div',{'class':'mrow'},h('b',null,'Memory'),h('span',null,fmtB(d.mem_used)+' / '+fmtB(d.mem_total))));
  b.appendChild(meter(mp));
  b.appendChild(h('div',{'class':'mrow'},h('b',null,'Load'),h('span',null,d.load1.toFixed(2)+'  '+d.load5.toFixed(2)+'  '+d.load15.toFixed(2))));
  b.appendChild(h('div',{'class':'mrow'},h('b',null,'Uptime'),h('span',null,fmtUp(d.uptime))));
  if(d.temp_c) b.appendChild(h('div',{'class':'mrow'},h('b',null,'Temperature'),h('span',null,d.temp_c.toFixed(0)+' \u00b0C')));
}
function pollSys(){
  if(!settings.widgets.system) return;
  fetch('/api/sys').then(function(r){return r.json();}).then(function(d){ sysHist.push(d.cpu); if(sysHist.length>60) sysHist.shift(); renderSys(d); }).catch(function(){});
}
function renderClock(){
  var d=new Date();
  $('clkbig').textContent=d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',second:'2-digit'});
  $('clkdate').textContent=d.toLocaleDateString([],{weekday:'long',day:'numeric',month:'long',year:'numeric'});
}
function renderExposure(){
  var b=$('expbody'); b.textContent='';
  if(!snap) return;
  var lan=0, ts=0, lo=0, gl=0, names={};
  snap.services.forEach(function(sv){ portGroups(sv).forEach(function(g){
    var l=g.reach.some(function(r){return r.group==='lan';}), t=g.reach.some(function(r){return r.group==='tailnet';}), x=g.reach.some(function(r){return r.scope==='global';});
    if(l) lan++; if(t) ts++; if(x){ gl++; names[sv.name]=1; }
    if(!l&&!t&&!x&&g.reach.some(function(r){return r.group==='loopback';})) lo++;
  }); });
  b.appendChild(h('div',{'class':'wstats4'},stat(lan,'LAN'),stat(ts,'Tailscale'),stat(lo,'Local only'),stat(gl,'Global v6',gl>0)));
  if(gl) b.appendChild(h('div',{'class':'note'},'Listening on a globally routable IPv6 address: '+Object.keys(names).join(', ')+'. Whether the internet can reach them depends on your router firewall.'));
  else b.appendChild(h('div',{'class':'bind',style:'margin-top:8px'},'Nothing listens on a globally routable address.'));
}
function startWidgets(){
  renderClock(); setInterval(renderClock,1000);
  renderSys(null); pollSys(); setInterval(pollSys,3000);
}
/* ---------- change detection, toasts, activity ---------- */
var events=[];
function lab(s){return status(s)[0];}
function diffSnap(a,b){
  var out=[], am={}, bm={};
  a.services.forEach(function(s){am[s.id]=s;});
  b.services.forEach(function(s){bm[s.id]=s;});
  b.services.forEach(function(s){
    var o=am[s.id];
    if(!o) out.push({id:s.id,name:s.name,msg:'appeared ('+lab(s)+')',kind:status(s)[1]});
    else if(lab(o)!==lab(s)) out.push({id:s.id,name:s.name,msg:'is now '+lab(s),kind:status(s)[1]});
  });
  a.services.forEach(function(s){ if(!bm[s.id]) out.push({id:s.id,name:s.name,msg:'was removed',kind:'off'}); });
  return out;
}
function toast(e){
  var box=$('toasts');
  var el=h('div',{'class':'toast',role:'status'},h('i',{'class':'dot '+e.kind}),h('div',null,h('b',null,e.name),h('span',null,e.msg)));
  el.addEventListener('click',function(){ openWin(e.id); if(el.parentNode) el.parentNode.removeChild(el); });
  box.appendChild(el);
  while(box.childNodes.length>4) box.removeChild(box.firstChild);
  setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); },7000);
}
function renderActivity(){
  var b=$('actbody'); b.textContent='';
  $('actn').textContent=String(events.length);
  if(!events.length){ b.appendChild(h('div',{'class':'bind'},'No changes since this page was opened.')); return; }
  events.slice(0,8).forEach(function(e){
    var row=h('div',{'class':'ev'},h('i',{'class':'dot '+e.kind}),
      h('div',null,h('b',null,e.name+' '),e.msg,h('div',{'class':'bind'},e.t.toLocaleTimeString())));
    row.addEventListener('click',function(){openWin(e.id);});
    b.appendChild(row);
  });
}
function renderBadge(){
  var n=snap? snap.services.filter(isProblem).length : 0, b=$('pbadge');
  b.textContent=String(n); b.classList.toggle('on',n>0);
}
/* ---------- wiring ---------- */
function renderAll(){ renderWidget(); renderIcons(); if(!$('start').hidden) renderStart(); }
function live(on){ var l=$('live'); l.className='live '+(on?'on':'off'); l.title=on?'Live':'Disconnected, retrying'; }
function apply(d){
  decorate(d);
  var old=snap; snap=d; live(true);
  if(old){ var ev=diffSnap(old,d); ev.forEach(function(e){ e.t=new Date(); events.unshift(e); toast(e); }); if(events.length>50) events.length=50; }
  renderAll(); renderActivity(); renderBadge(); renderExposure(); refreshAllWins();
}
function poll(){
  fetch('/api/snapshot').then(function(r){return r.json();}).then(apply).catch(function(){live(false);})
    .then(function(){setTimeout(poll,5000);});
}
function connect(){
  if(!window.EventSource){ poll(); return; }
  var es=new EventSource('/events');
  es.onmessage=function(e){ try{ apply(JSON.parse(e.data)); }catch(x){} };
  es.onerror=function(){ live(false); };
}
$('startbtn').addEventListener('click',function(){toggleStart();});
$('searchbtn').addEventListener('click',function(){toggleStart(true);});
$('q').addEventListener('input',function(e){ query=e.target.value.trim().toLowerCase(); renderStart(); });
$('q').addEventListener('keydown',function(e){ if(e.key==='Enter'){ var v=startList()[0]; if(v) openWin(v.id); } });
$('desktop').addEventListener('click',function(){ selected=null; markSel(); closeStart(); });
document.addEventListener('pointerdown',function(e){
  if(!$('start').hidden && !e.target.closest('#start') && !e.target.closest('#startbtn') && !e.target.closest('#searchbtn')) closeStart();
});
document.addEventListener('keydown',function(e){
  var typing=/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
  if(e.key==='Escape'){ closeStart(); hideMenu(); if(!$('dlg').hidden) closeDlg(); return; }
  if(typing||!$('dlg').hidden) return;
  if(e.key==='/'){ e.preventDefault(); toggleStart(true); return; }
  var sv=selected? byId(selected) : null;
  if(e.key==='F5'){ e.preventDefault(); renderAll(); refreshAllWins(); }
  else if(e.key==='Enter'&&sv){ openService(sv); }
  else if(e.key==='F2'&&sv&&!sv.app){ e.preventDefault(); renameDlg(sv); }
  else if(e.key==='Delete'&&sv&&!sv.app){ if(settings.hidden.indexOf(sv.id)<0) settings.hidden.push(sv.id); selected=null; changed(); }
  else if(/^Arrow/.test(e.key)){
    var ic=[].slice.call($('icons').querySelectorAll('.icon')); if(!ic.length) return; e.preventDefault();
    var i=ic.findIndex(function(x){return x.getAttribute('data-id')===selected;});
    var rows=Math.max(1,getComputedStyle($('icons')).gridTemplateRows.split(' ').length);
    var dlt={ArrowDown:1,ArrowUp:-1,ArrowRight:rows,ArrowLeft:-rows}[e.key];
    i=i<0? 0 : Math.max(0,Math.min(ic.length-1,i+dlt));
    selected=ic[i].getAttribute('data-id'); markSel(); ic[i].focus();
  }
});
applySettings();
tick(); setInterval(tick,15000);
renderIcons();
renderActivity();
startWidgets();
connect();
})();
