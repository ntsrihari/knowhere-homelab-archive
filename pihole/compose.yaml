name: pihole

services:
  pihole:
    container_name: pihole
    image: pihole/pihole:latest
    hostname: pihole
    restart: unless-stopped
    ports:
      - "${PIHOLE_IP:?Set PIHOLE_IP in .env}:53:53/tcp"
      - "${PIHOLE_IP:?Set PIHOLE_IP in .env}:53:53/udp"
      - "${PIHOLE_IP:?Set PIHOLE_IP in .env}:8081:80/tcp"
      - "${PIHOLE_TAILSCALE_IP:?Set PIHOLE_TAILSCALE_IP in .env}:53:53/tcp"
      - "${PIHOLE_TAILSCALE_IP:?Set PIHOLE_TAILSCALE_IP in .env}:53:53/udp"
      - "${PIHOLE_TAILSCALE_IP:?Set PIHOLE_TAILSCALE_IP in .env}:8081:80/tcp"
    environment:
      TZ: Asia/Kolkata
      FTLCONF_webserver_api_password: ${PIHOLE_PASSWORD:?Set PIHOLE_PASSWORD in .env}
      FTLCONF_dns_listeningMode: ALL
      FTLCONF_dns_upstreams: "1.1.1.1;9.9.9.9"
    volumes:
      - type: bind
        source: /srv/appdata/pihole/etc-pihole
        target: /etc/pihole
        bind:
          create_host_path: false
    security_opt:
      - no-new-privileges:true
