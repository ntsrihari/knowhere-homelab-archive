name: qbittorrent

services:
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    restart: unless-stopped
    environment:
      PUID: "1000"
      PGID: "1000"
      UMASK: "022"
      TZ: Asia/Kolkata
      WEBUI_PORT: "8080"
      TORRENTING_PORT: "6881"
    ports:
      - "8080:8080"
      - "6881:6881"
      - "6881:6881/udp"
    volumes:
      - type: bind
        source: /srv/appdata/qbittorrent
        target: /config
        bind:
          create_host_path: false
      - type: bind
        source: /mnt/media/Media
        target: /media
        bind:
          create_host_path: false
