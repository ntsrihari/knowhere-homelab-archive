name: navidrome

services:
  navidrome:
    image: deluan/navidrome:latest
    container_name: navidrome
    restart: unless-stopped
    ports:
      - "4533:4533"
    environment:
      ND_MUSICFOLDER: /music
      ND_DATAFOLDER: /data
      ND_SCANSCHEDULE: 1h
      ND_LOGLEVEL: info
      TZ: Asia/Kolkata
    volumes:
      - navidrome_data:/data
      - /mnt/media/Media/Music:/music/ssd:ro
      - /mnt/internal-hdd/MUSIC:/music/hdd:ro

volumes:
  navidrome_data:
