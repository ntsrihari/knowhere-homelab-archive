# MeshCentral: live screens and control of my PCs, laptops and Android phones, in the browser.
# Only on Tailscale: HTTPS (own certificate) on 100.104.30.99:4430, i.e.
# https://100.104.30.99:4430
services:
  meshcentral:
    image: ghcr.io/ylianst/meshcentral:1.3.1
    container_name: meshcentral
    restart: unless-stopped
    network_mode: host
    environment:
      DYNAMIC_CONFIG: "false"
    volumes:
      - ./data:/opt/meshcentral/meshcentral-data
      - meshcentral-files:/opt/meshcentral/meshcentral-files
      - meshcentral-backups:/opt/meshcentral/meshcentral-backups
volumes:
  meshcentral-files:
  meshcentral-backups:
