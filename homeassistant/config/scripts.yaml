# Fire TV buttons. adb_command runs a shell line on the TV over the Android Debug Bridge integration.
fire_tv_movie_night:
  alias: Movie night
  icon: mdi:movie-open
  description: Wakes the TV and opens Jellyfin.
  sequence:
    - action: androidtv.adb_command
      target: { entity_id: media_player.fire_tv }
      data: { command: "input keyevent 224" }
    - delay: { seconds: 2 }
    - action: androidtv.adb_command
      target: { entity_id: media_player.fire_tv }
      data: { command: "monkey -p org.jellyfin.androidtv -c android.intent.category.LEANBACK_LAUNCHER 1" }

